# Place at: .github/workflows/release-sync.yml in each source repo.
# Fill in target_repo for that repo, and add the RELEASE_SYNC_DEPLOY_KEY secret.
name: Release Sync

on:
  push:
    branches: [release]

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync release to customer repo
        uses: your-org/release-sync-action@v1
        with:
          target_repo: git@github.com:customer-org/REPO-NAME.git
          deploy_key: ${{ secrets.RELEASE_SYNC_DEPLOY_KEY }}

      - name: Notify on failure
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "Release sync FAILED: ${{ github.repository }}"
          to: ${{ secrets.ALERT_EMAIL_TO }}
          from: Release Sync Bot
          body: |
            The release-sync workflow failed for ${{ github.repository }} at commit ${{ github.sha }}.
            Logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
